<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Gradient for the outer ring -->
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF3B33" />
      <stop offset="100%" stop-color="#FDA1A2" />
    </linearGradient>
    <!-- Gradient for the text/monogram -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FDA1A2" />
    </linearGradient>
    <!-- Subtle shadow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer glowing blur (very subtle) -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="#EF3B33" stroke-width="2" opacity="0.15" filter="url(#glow)" />

  <!-- Main Outer Ring -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="url(#ring-grad)" stroke-width="1.5" />

  <!-- Decorative Inner Ring (dashed/orbit) -->
  <circle cx="60" cy="60" r="48" fill="none" stroke="#FFFFFF" stroke-width="0.75" stroke-dasharray="4 3" opacity="0.2" />

  <!-- Center Monogram "RM" -->
  <g transform="translate(60, 64)">
    <!-- Letter 'R' -->
    <text x="-16" y="8" font-family="'Playfair Display', 'Cormorant Garamond', serif" font-weight="800" font-style="italic" font-size="34" fill="url(#text-grad)" letter-spacing="-0.05em">R</text>
    <!-- Letter 'M' -->
    <text x="3" y="11" font-family="'Playfair Display', 'Cormorant Garamond', serif" font-weight="700" font-style="normal" font-size="28" fill="#EF3B33" opacity="0.95">M</text>
  </g>

  <!-- Accent Dots or stars representing strategy & performance -->
  <circle cx="60" cy="18" r="2" fill="#FDA1A2" />
  <circle cx="60" cy="102" r="2" fill="#FDA1A2" />
  <circle cx="18" cy="60" r="2" fill="#EF3B33" />
  <circle cx="102" cy="60" r="2" fill="#EF3B33" />
</svg>
